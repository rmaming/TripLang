<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TripLang">
  <title>TripLang</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Back" hidden>&#8592;</button>
    <h1 id="title">TripLang</h1>
    <button id="menuBtn" class="icon-btn" aria-label="Menu">&#8942;</button>
  </header>

  <main id="app"></main>

  <button id="fab" class="fab" aria-label="Add">+</button>

  <!-- Bottom sheet used for all forms -->
  <div id="sheetBackdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" hidden></section>

  <!-- Full-screen photo viewer -->
  <div id="viewer" class="viewer" hidden></div>

  <input id="photoInput" type="file" accept="image/*" multiple hidden>
  <input id="importInput" type="file" accept="application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
