<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1f0e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TripLang">
  <title>TripLang</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app"></main>

  <!-- Home: new journey button. Trip: floating bottom navigation. -->
  <button id="fab" class="fab" hidden></button>
  <nav id="nav" class="nav" hidden></nav>

  <!-- Bottom sheet used for all forms -->
  <div id="sheetBackdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" hidden></section>

  <!-- Full-screen photo viewer -->
  <div id="viewer" class="viewer" hidden></div>

  <input id="photoInput" type="file" accept="image/*" multiple hidden>
  <input id="entryPhotoInput" type="file" accept="image/*" multiple hidden>
  <input id="importInput" type="file" accept="application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
